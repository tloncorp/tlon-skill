name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_call: {}
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  build:
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: npm ci

      - name: Build binary
        run: node scripts/build-all.js --target=${{ matrix.target }}

      - name: Smoke binary
        run: npm run release:binary-smoke -- --binary npm/${{ matrix.target }}/tlon

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: npm/${{ matrix.target }}/tlon
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: npm ci

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts

      - name: Pack release tarballs
        run: npm run release:package -- --artifacts-dir artifacts --out-dir release-tarballs

      - name: Upload package tarballs
        uses: actions/upload-artifact@v4
        with:
          name: package-tarballs
          path: release-tarballs/*
          if-no-files-found: error

  package-smoke:
    needs: package
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: npm ci

      - name: Download package tarballs
        uses: actions/download-artifact@v4
        with:
          name: package-tarballs
          path: release-tarballs

      - name: Smoke installed package
        run: npm run release:package-smoke -- --tarball-dir release-tarballs --target=${{ matrix.target }}

  publish:
    needs: package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: npm ci

      - name: Download package tarballs
        uses: actions/download-artifact@v4
        with:
          name: package-tarballs
          path: release-tarballs

      - name: Read package version
        id: package
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
        run: echo "Dry run: skipping npm publish"

      - name: Publish platform packages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            npm publish "release-tarballs/tloncorp-tlon-skill-${target}-${{ steps.package.outputs.version }}.tgz" --access public --provenance
          done

      - name: Publish root package
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run == 'false' }}
        run: npm publish "release-tarballs/tloncorp-tlon-skill-${{ steps.package.outputs.version }}.tgz" --access public --provenance
