name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publish)"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14        # ARM64
            target: darwin-arm64
          - os: macos-13        # x64
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: node scripts/build-all.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: npm/${{ matrix.target }}/tlon

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.dry_run == 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy binaries to npm packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64; do
            cp artifacts/binary-$target/tlon npm/$target/
            chmod +x npm/$target/tlon
          done

      - name: Publish platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64; do
            echo "Publishing @tloncorp/tlon-skill-$target..."
            cd npm/$target
            npm publish --access public --provenance
            cd ../..
          done

      - name: Publish main package
        run: npm publish --access public --provenance
